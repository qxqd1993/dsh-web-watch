# ============================================================================
# dsh-web-watch —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 照 dsh-bili-subagent 的 cordis.patch.yml：包自己声明要往 profile 的配置树里插什么。
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效，
# 不用再手改 profile 自己的 cordis.patch.yml：
#
#   dsh plugin --profile desktop add link:E:\dsh\dsh-workspace\dsh-dialog-thread1\dsh-web-watch
#
# ⚠️ 三件事：
#   ① `id` 必须等于 lib/index.js 导出的 `name`（= `web-watch`）。
#      DSH 插件设置表单的命名空间 ns 就是 loader 条目的 id，对不上 ⇒ 那一行设置不是我们的，
#      `settings.update()` 也就永远写不到我们的字段（bili 那边踩过，见其 index.js:290-301）。
#   ② `name` 是包名（node_modules 里那个）。
#   ③ 真正的用户配置在插件自己的 config 里（设置页可改），这里只放默认值。
# ============================================================================

- insert:
    - id: web-watch
      name: dsh-web-watch
      config:
        enabled: true
