name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 離線煙霧測試（66 項，不打網路 / 不含 P1 CLI 7 項）
        run: node scripts/smoke.mjs --offline

      - name: SSRF 案例表（注入 resolve，零真 DNS）
        run: node probe/safeurl-cases.mjs

      - name: 抽取器評測（fixtures，離線）
        run: node probe/extract-eval.mjs
